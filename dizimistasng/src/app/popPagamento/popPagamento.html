<p-dialog header="Cadastro de Pagamentos" [(visible)]="visivel" (onHide)="fecharModal()" [modal]="true"
  [style]="{ width: '700px', height: '60vh' }">

  <!-- Formulário -->
  <form [formGroup]="formularioPagamento" (ngSubmit)="salvarPagamento()">

    <div class="container">

      <!-- BLOCO DA ESQUERDA: CAMPOS -->
      <div class="campos">
        <label for="fiel">Fiel</label>
        <p-autoComplete id="fiel" formControlName="nome" [suggestions]="fieisFiltrados"
          (completeMethod)="buscarFieis($event)" [readonly]="true" field="nome"
          placeholder="Digite o nome ou CPF do fiel..." [dropdown]="true" [showClear]="true"
          optionLabel="nome"></p-autoComplete>

        <!-- Valor -->
        <div class="campo">
          <label>Valor</label>
          <p-inputNumber formControlName="valor" placeholder="Valor (R$)" mode="currency" currency="BRL" locale="pt-BR"
            [invalid]="formularioPagamento.get('valor')?.invalid && formularioPagamento.get('valor')?.touched" />
          @if (formularioPagamento.get('valor')?.invalid && formularioPagamento.get('valor')?.touched) {
          <p-message severity="error" variant="simple" size="small">O valor é obrigatório</p-message>
          }
        </div>

        <!-- Tipo do pagamento -->
        <div class="campo tipo">

          <div class="flex align-items-center gap-2">
            <p-radiobutton name="tipo" formControlName="tipo" inputId="oferta" [value]="1">
            </p-radiobutton>

            <label for="oferta">Oferta</label>
          </div>

          <div class="flex align-items-center gap-2">
            <p-radiobutton name="tipo" formControlName="tipo" inputId="dizimo" [value]="2">
            </p-radiobutton>

            <label for="dizimo">Dízimo</label>
          </div>

        </div>

      </div>

      <!-- BLOCO DA DIREITA: BOTÕES -->
      <div class="acoes">
        <p-button label="Novo" [disabled]="!novoHabilitado" (onClick)="novoPagamento()"></p-button>
        <p-button label="Alterar" [disabled]="!alterarHabilitado" (onClick)="editarPagamento()"></p-button>
        <p-button label="Apagar" [disabled]="!apagarHabilitado" (onClick)="apagarPagamento()"></p-button>
        <p-button label="Salvar" [disabled]="!salvarHabilitado" (onClick)="salvarPagamento()"></p-button>
        <p-button label="Cancelar" [disabled]="!cancelarHabilitado" (onClick)="cancelarPagamento()"></p-button>
        <p-button label="Fechar" [disabled]="!fecharHabilitado" (onClick)="fecharModal()"></p-button>
      </div>

    </div>
  </form>
</p-dialog>
